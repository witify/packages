name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Pint and PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --error-format=github --no-progress --memory-limit=1G

  tests:
    name: ${{ matrix.package }} on PHP ${{ matrix.version.php }} / Laravel ${{ matrix.version.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # `version` is a matrix dimension, not an `include` list: include entries
      # without a `package` key all merge into the same combination and only the
      # last one runs.
      matrix:
        package: [devops]
        version:
          - { php: "8.0", laravel: "8.*", testbench: "^6.23", phpunit: "^9.5" }
          - { php: "8.1", laravel: "9.*", testbench: "^7.6", phpunit: "^9.5" }
          - { php: "8.4", laravel: "12.*", testbench: "^10.0", phpunit: "^11.5" }

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.version.php }}
          extensions: mbstring, fileinfo, dom, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies for Laravel ${{ matrix.version.laravel }}
        # Laravel 8 and 9 are end of life and carry security advisories; Composer
        # refuses them by default, but they are exactly what this matrix tests.
        run: |
          composer config policy.advisories.block false
          composer update --prefer-dist --no-interaction --no-progress \
            --with "illuminate/support:${{ matrix.version.laravel }}" \
            --with "orchestra/testbench:${{ matrix.version.testbench }}" \
            --with "phpunit/phpunit:${{ matrix.version.phpunit }}"

      - name: PHPUnit
        run: vendor/bin/phpunit
