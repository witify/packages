name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Pint and PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --error-format=github --no-progress --memory-limit=1G

  tests:
    name: ${{ matrix.package }} on PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: [devops]
        include:
          - php: "8.0"
            laravel: "8.*"
            testbench: "^6.23"
            phpunit: "^9.5"
          - php: "8.1"
            laravel: "9.*"
            testbench: "^7.6"
            phpunit: "^9.5"
          - php: "8.4"
            laravel: "12.*"
            testbench: "^10.0"
            phpunit: "^11.5"

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo, dom, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies for Laravel ${{ matrix.laravel }}
        run: |
          composer update --prefer-dist --no-interaction --no-progress \
            --with "illuminate/support:${{ matrix.laravel }}" \
            --with "orchestra/testbench:${{ matrix.testbench }}" \
            --with "phpunit/phpunit:${{ matrix.phpunit }}"

      - name: PHPUnit
        run: vendor/bin/phpunit
